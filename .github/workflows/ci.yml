name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest   # Docker is preinstalled; Postgres integration tests use Testcontainers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build Axiom.slnx -c Release
      - run: dotnet test Axiom.slnx -c Release --no-build
  portal:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/Axiom.Portal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
