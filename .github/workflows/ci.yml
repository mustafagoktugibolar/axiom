name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest   # Docker is preinstalled; Postgres integration tests use Testcontainers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build Axiom.slnx -c Release
      - run: dotnet test Axiom.slnx -c Release --no-build
  portal:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/Axiom.Portal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
  images:
    # The Dockerfile compiles in Release, where analyzer rules the Debug build skips can fail: build it on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile --target api -t axiom-api:ci .
      - run: docker build -f deploy/docker/Dockerfile --target workers -t axiom-workers:ci .
  deploy-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/axiom --set auth.authority=https://idp.example.test --set database.connectionString=x
      - run: kubectl kustomize deploy/kustomize/overlays/dev > /dev/null
      - run: kubectl kustomize deploy/kustomize/overlays/prod > /dev/null
      - run: kubectl kustomize deploy/kustomize/overlays/local > /dev/null
