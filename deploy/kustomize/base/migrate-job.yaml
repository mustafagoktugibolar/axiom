# Applies EF migrations. A Job's pod template is immutable, so delete the previous run before applying:
#   kubectl -n axiom delete job axiom-migrate --ignore-not-found
# (Argo CD: this carries PreSync hook annotations and is replaced automatically.)
apiVersion: batch/v1
kind: Job
metadata:
  name: axiom-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: axiom
      securityContext: { runAsNonRoot: true, runAsUser: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: axiom-api
          args: ["--migrate"]
          env:
            - name: ConnectionStrings__Axiom
              valueFrom: { secretKeyRef: { name: axiom-secrets, key: connection-string } }
          envFrom:
            - configMapRef: { name: axiom-config }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
