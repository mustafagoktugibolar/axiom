apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiom-api
  labels: { app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: axiom, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: axiom, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: axiom
      securityContext: { runAsNonRoot: true, runAsUser: 1654, seccompProfile: { type: RuntimeDefault } }
      # Applies pending EF migrations before the API starts; concurrent replicas are serialized by EF's lock.
      initContainers:
        - name: migrate
          image: axiom-api
          args: ["--migrate"]
          env:
            - name: ConnectionStrings__Axiom
              valueFrom: { secretKeyRef: { name: axiom-secrets, key: connection-string } }
          envFrom:
            - configMapRef: { name: axiom-config }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: api
          image: axiom-api
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Axiom
              valueFrom: { secretKeyRef: { name: axiom-secrets, key: connection-string } }
          envFrom:
            - configMapRef: { name: axiom-config }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, failureThreshold: 3 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: axiom
spec:
  selector: { app.kubernetes.io/name: axiom, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: axiom-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: axiom, app.kubernetes.io/component: api }
