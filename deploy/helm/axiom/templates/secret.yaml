{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axiom.secretName" . }}
  labels: {{- include "axiom.labels" . | nindent 4 }}
type: Opaque
stringData:
  connection-string: {{ include "axiom.connectionString" . | quote }}
  {{- if .Values.auth.devMode.enabled }}
  dev-signing-key: {{ required "auth.devMode.signingKey (32+ chars) is required in devMode" .Values.auth.devMode.signingKey | quote }}
  {{- end }}
  {{- range .Values.governance.credentials }}
  {{- if .token }}
  {{ .secretKey }}: {{ .token | quote }}
  {{- end }}
  {{- end }}
{{- end }}
