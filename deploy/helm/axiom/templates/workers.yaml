{{- if .Values.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axiom.fullname" . }}-workers
  labels: {{- include "axiom.labels" . | nindent 4 }}
    app.kubernetes.io/component: workers
spec:
  replicas: {{ .Values.workers.replicas }}
  selector:
    matchLabels: {{- include "axiom.selector" . | nindent 6 }}
      app.kubernetes.io/component: workers
  template:
    metadata:
      labels: {{- include "axiom.labels" . | nindent 8 }}
        app.kubernetes.io/component: workers
      annotations:
        checksum/config: {{ .Values.config | toYaml | sha256sum }}{{ .Values.auth | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ include "axiom.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: workers
          image: {{ include "axiom.image" (dict "root" . "name" .Values.image.workers) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "axiom.env" . | nindent 10 }}
          resources: {{- toYaml .Values.workers.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          # Git mirrors are a cache (deleting costs a re-fetch); they need a writable temp directory.
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
