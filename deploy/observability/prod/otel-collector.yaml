# Production: a central OpenTelemetry Collector. Axiom (api and workers) sends OTLP to it; it forwards logs to Loki,
# traces to Tempo and metrics to Prometheus. Axiom itself only needs OTEL_EXPORTER_OTLP_ENDPOINT, so the backends
# can be self-hosted (Grafana's loki / tempo / prometheus charts) or managed (Grafana Cloud, Azure Monitor, ...).
#
# Edit the three endpoints below (or patch them in your overlay), then:
#   kubectl apply -f deploy/observability/prod/otel-collector.yaml
# and point Axiom at it: helm value observability.otlp.endpoint = http://otel-collector.observability.svc:4317
#
# Prometheus must run with --web.enable-remote-write-receiver (or use Mimir/Thanos receive).
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 20 }
      batch: {}
    exporters:
      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc/otlp
      otlp/tempo:
        endpoint: tempo.observability.svc:4317
        tls: { insecure: true }
      prometheusremotewrite:
        endpoint: http://prometheus-server.observability.svc/api/v1/write
    service:
      pipelines:
        logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki] }
        traces:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo] }
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheusremotewrite] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.118.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/otel }]
      volumes: [{ name: config, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
